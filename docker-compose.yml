# APAAR Ledger prototype: `docker compose up` brings up db, api and web.
# Values below fall back to dev defaults; override them in a `.env` file (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apaar}
      POSTGRES_DB: ${POSTGRES_DB:-apaar}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apaar} -d ${POSTGRES_DB:-apaar}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-apaar}:${POSTGRES_PASSWORD:-apaar}@db:5432/${POSTGRES_DB:-apaar}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-apaar}:${POSTGRES_PASSWORD:-apaar}@db:5432/apaar_test
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
      FERNET_KEY: ${FERNET_KEY:-}
      TOKEN_PEPPER: ${TOKEN_PEPPER:-dev-only-insecure-pepper}
      SIGNING_KEY_PASSPHRASE: ${SIGNING_KEY_PASSPHRASE:-dev-only-insecure-passphrase}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENABLE_LABSE: ${ENABLE_LABSE:-false}
      AUTO_SEED_NATIONAL: ${AUTO_SEED_NATIONAL:-true}
      SYNTH_SEED: ${SYNTH_SEED:-42}
      SYNTH_INSTITUTIONS: ${SYNTH_INSTITUTIONS:-40}
      SYNTH_STUDENTS: ${SYNTH_STUDENTS:-20000}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      # First start generates and replays the national synthetic dataset (~40-60 s) before uvicorn runs.
      start_period: 120s

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"

volumes:
  pgdata:
